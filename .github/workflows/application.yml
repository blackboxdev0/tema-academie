name: Application verification
on:
  push:
    paths: ['app/**', 'config/project.json', '_bmad-output/planning-artifacts/ux-designs/**/catalogue-source-24-*.json', '.github/workflows/application.yml']
  pull_request:
    paths: ['app/**', 'config/project.json', '_bmad-output/planning-artifacts/ux-designs/**/catalogue-source-24-*.json', '.github/workflows/application.yml']
permissions:
  contents: read
concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.9.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify
        env:
          TEMA_TEST_API_URL: ''
          TEMA_BROWSER_MATRIX: all
