name: Likuid
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'likuid-production' || format('likuid-verification-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.9.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: python3 -B -m unittest discover -s tests/deploy -v
      - run: npm run verify
        env:
          TEMA_TEST_API_URL: ''
          TEMA_BROWSER_MATRIX: all
          TEMA_LIKUID_ACCEPTED_CONTRAST: '1'
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: likuid-browser-report
          path: app/playwright-report/
          if-no-files-found: warn

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: likuid-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.9.0'
      - name: Build and check the attested production site
        run: node app/scripts/build-likuid.cjs "$RUNNER_TEMP/tema-likuid-build"
        env:
          TEMA_PRODUCTION_PROFILE_JSON: ${{ secrets.TEMA_PRODUCTION_PROFILE_JSON }}
      - name: Verify and activate over FTPS
        run: python3 -B app/scripts/publish-likuid.py "$RUNNER_TEMP/tema-likuid-build/web"
        env:
          LIKUID_FTP_USERNAME: ${{ secrets.LIKUID_FTP_USERNAME }}
          LIKUID_FTP_PASSWORD: ${{ secrets.LIKUID_FTP_PASSWORD }}
